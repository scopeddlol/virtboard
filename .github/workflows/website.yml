name: Website image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test download server
        run: node --test website/server.test.mjs
      - name: Smoke test container
        run: |
          docker build -t virtboard-website:test .
          mkdir -p "$RUNNER_TEMP/virtboard-data"
          printf 'installer-fixture' > "$RUNNER_TEMP/virtboard-data/Virtboard-Setup-0.2.0.exe"
          docker run -d --name website-test --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:4186:8080 -v "$RUNNER_TEMP/virtboard-data:/data:ro" virtboard-website:test
          trap 'docker logs website-test; docker rm -f website-test' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4186/healthz
          test "$(curl --fail --location http://127.0.0.1:4186/download)" = 'installer-fixture'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/virtboard-website
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
