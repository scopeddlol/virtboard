name: Release

on:
  push:
    tags: ['v*']
    # A branch push whose commit message contains "[release]" also publishes a
    # release; the tag is created from package.json's version (v0.1.0 → v0.1).
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Virtboard-Setup
          path: |
            release/Virtboard-Setup-*.exe
            release/Virtboard-Setup-*.exe.blockmap

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            v=$(node -p "require('./package.json').version")
            echo "tag=v${v%.0}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Virtboard ${{ steps.tag.outputs.tag }}
          body_path: docs/RELEASE_NOTES.md
          make_latest: true
          files: |
            release/Virtboard-Setup-*.exe
            release/Virtboard-Setup-*.exe.blockmap
